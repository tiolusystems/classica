# Single-use publication pipeline for explicitly approved Clássica v2.1.1.
# The validated app is immutable: only this file may change from the audited main.
name: Publish Clássica 2.1.1 once

on:
  workflow_run:
    workflows: ["Quality and release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: classica-release-2.1.1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified Clássica v2.1.1
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact SHA approved by required CI
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Ensure this is the single-file approved release change
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_PARENT: 88894f4c0e33962f653a8a379ed5e703fa2624bb
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/publish-v2.1.1.yml"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$HEAD_SHA"
          echo "Source provenance and main immutability: PASS"
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Rebuild deterministic ZIP; verify checksum, structure and version
        shell: bash
        run: |
          set -euo pipefail
          python -c "import app; assert app.VERSION == '2.1.1'"
          python scripts/verify_release.py
          python scripts/package_release.py
          test -s dist/Classica-2.1.1-Windows-x64.zip
          test -s dist/Classica-2.1.1-Windows-x64.zip.sha256
          (cd dist && sha256sum --check Classica-2.1.1-Windows-x64.zip.sha256)
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("dist/Classica-2.1.1-Windows-x64.zip") as archive:
              assert archive.testzip() is None
              files = set(archive.namelist())
              assert "Classica/app.py" in files
              assert "Classica/Iniciar.bat" in files
              assert "Classica/Iniciar discreto.bat" in files
              assert b"VERSION = \"2.1.1\"" in archive.read("Classica/app.py")
          print("ZIP 2.1.1, both launchers and SHA-256: PASS")
          PY
      - name: Create protected version ref and publish ZIP and SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag_status=0
          tag_info="$(git ls-remote --exit-code --tags origin refs/tags/v2.1.1)" || tag_status=$?
          if [ "$tag_status" -eq 0 ]; then
              tag_sha="$(printf '%s' "$tag_info" | cut -f1)"
              test -n "$tag_sha"
          elif [ "$tag_status" -eq 2 ]; then
              tag_sha=""
          else
              echo "Remote tag lookup failed. Abort without publishing." >&2
              exit 1
          fi
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$HEAD_SHA" ]; then
              echo "Tag v2.1.1 already exists at another SHA. Refusing overwrite." >&2
              exit 1
          fi
          if gh release view v2.1.1 >/dev/null 2>&1; then
              echo "v2.1.1 was already published; no duplicate publication."
              exit 0
          fi
          if [ -z "$tag_sha" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v2.1.1 -f sha="$HEAD_SHA" >/dev/null
          fi
          gh release create v2.1.1 \
            dist/Classica-2.1.1-Windows-x64.zip \
            dist/Classica-2.1.1-Windows-x64.zip.sha256 \
            --verify-tag \
            --title "Clássica v2.1.1" \
            --notes-file CHANGELOG.md
          gh release view v2.1.1 --json tagName,isDraft,assets \
            --jq '.tagName, .isDraft, (.assets | map({name: .name, size: .size}))'
