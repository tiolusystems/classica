name: Quality and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --require-hashes -r requirements.lock
      - name: Windows syntax and pinned setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'iniciar.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          .\scripts\build_launcher.ps1
          .\iniciar.ps1 -SetupOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Test Windows with bundled environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ffmpeg = Get-ChildItem -LiteralPath '.tools\ffmpeg' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $env:PATH = (Join-Path $PWD '.tools\bin') + ';' + $ffmpeg.DirectoryName + ';' + $env:PATH
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          exit $LASTEXITCODE
      - name: Check release contract
        run: python scripts/verify_release.py

  interface:
    name: Responsive interface and reading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --check web/app.js
      - run: npm run test:ui
      - name: Interface evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Classica-interface
          path: output/ui/*
          if-no-files-found: ignore


  clean-package:
    name: Clean Windows ZIP installation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile branded Windows launcher
        shell: powershell
        run: .\scripts\build_launcher.ps1
      - name: Verify and build production ZIP
        run: |
          python scripts/verify_release.py
          python scripts/package_release.py
      - name: Fresh ZIP extraction, dependency setup, localhost and media suite
        shell: powershell
        run: |
          .\scripts\windows_clean_install.ps1 -Archive (Join-Path $PWD 'dist\Classica-2.2.0-Windows-x64.zip')
      - name: Store verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Classica-Windows-x64
          path: dist/*
          if-no-files-found: error

  release:
    name: Package and publish release
    needs: [test, interface, clean-package]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: classica-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate version tag
        run: python -c "import app,os; assert os.environ['GITHUB_REF'] in ('refs/heads/main', 'refs/tags/v'+app.VERSION), 'Version/ref mismatch'"
      - name: Read application version
        id: version
        run: python -c "import app; print('tag=v'+app.VERSION)" >> "$GITHUB_OUTPUT"
      - run: python scripts/verify_release.py
      - name: Download the exact ZIP tested on Windows
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Classica-Windows-x64
          path: dist
      - name: Verify downloaded ZIP checksum
        working-directory: dist
        run: sha256sum -c *.sha256
      - name: Publish ZIP and SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            echo 'This version is already published; its tag and assets remain unchanged.'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            if [ "$target" != "$GITHUB_SHA" ]; then
              echo 'An existing tag points to another commit; publication refused.' >&2
              exit 1
            fi
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 --target "$GITHUB_SHA" --title "Clássica ${RELEASE_TAG#v}" --notes-file CHANGELOG.md
