name: Quality and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --require-hashes -r requirements.lock
      - name: Windows syntax and pinned setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'iniciar.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          .\iniciar.ps1 -SetupOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Linux
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Test Windows with bundled environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ffmpeg = Get-ChildItem -LiteralPath '.tools\ffmpeg' -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $env:PATH = (Join-Path $PWD '.tools\bin') + ';' + $ffmpeg.DirectoryName + ';' + $env:PATH
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          exit $LASTEXITCODE
      - name: Check release contract
        run: python scripts/verify_release.py

  interface:
    name: Responsive interface and reading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --check web/app.js
      - run: npm run test:ui


  clean-package:
    name: Clean Windows ZIP installation
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify and build production ZIP
        run: |
          python scripts/verify_release.py
          python scripts/package_release.py
      - name: Fresh ZIP extraction, dependency setup, localhost and media suite
        shell: powershell
        run: |
          .\scripts\windows_clean_install.ps1 -Archive (Join-Path $PWD 'dist\Classica-2.1.1-Windows-x64.zip')

  release:
    name: Package and publish release
    needs: [test, interface, clean-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate version tag
        run: python -c "import app,os; assert os.environ['GITHUB_REF_NAME'] == 'v'+app.VERSION, 'Version tag mismatch'"
      - run: python scripts/verify_release.py
      - run: python scripts/package_release.py
      - name: Publish ZIP and SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --verify-tag --title "Clássica $GITHUB_REF_NAME" --notes-file CHANGELOG.md
